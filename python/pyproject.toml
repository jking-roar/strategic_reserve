[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategic-reserve-python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
description = "Accessible Tk desktop edition of Mark Steere's Strategic Reserve"
readme = "README.md"
authors = [{name = "Strategic Reserve contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: X11 Applications :: Tk",
]

[project.scripts]
strategic-reserve = "strategic_reserve_launcher:main"

[tool.setuptools]
py-modules = ["strategic_reserve_launcher"]

[tool.setuptools.packages.find]
where = ["."]
include = ["game_engine*", "ai*", "ui*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:asyncio"
